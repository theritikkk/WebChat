name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build --workspace=@webchat/client

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push unified app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/webchat-app:${{ github.sha }}
            ghcr.io/${{ github.repository }}/webchat-app:latest
      # Also push service tags if required by specification
      - name: Push service specific tags
        if: github.event_name != 'pull_request'
        run: |
          for SERVICE in auth chat gateway messages; do
            docker buildx build --platform linux/amd64 -f deploy/docker/Dockerfile -t ghcr.io/${{ github.repository }}/${SERVICE}:${{ github.sha }} --push .
          done

  integration-test:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build local dev image
        run: |
          docker build -f deploy/docker/Dockerfile -t webchat-app:latest .
      - name: Start services via Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d postgres mongo redis elasticsearch
          # Run chat, gateway, auth, messages
          # In local compose setup, we run services directly or via compose
          # Let's ensure databases are healthy
          echo "Waiting for databases to be ready..."
          sleep 15
      - name: Setup Node and run smoke test
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run k6 smoke health test
        run: |
          docker run --rm -i grafana/k6 run - <scripts/loadtest/k6-health.js

  deploy:
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Configure Kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "KUBE_CONFIG secret is not set, skipping actual cluster deploy"
            exit 0
          fi
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          kubectl config use-context default || true
      - name: Deploy to K8s cluster
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "Mock deploy: kubectl set image deployment/gateway gateway=ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}"
            exit 0
          fi
          kubectl set image deployment/gateway gateway=ghcr.io/${{ github.repository }}/webchat-app:${{ github.sha }} -n webchat
          kubectl set image deployment/auth auth=ghcr.io/${{ github.repository }}/webchat-app:${{ github.sha }} -n webchat
          kubectl set image deployment/messages messages=ghcr.io/${{ github.repository }}/webchat-app:${{ github.sha }} -n webchat
          kubectl set image deployment/chat chat=ghcr.io/${{ github.repository }}/webchat-app:${{ github.sha }} -n webchat
          kubectl rollout status deployment/gateway -n webchat
