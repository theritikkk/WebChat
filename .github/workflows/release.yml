name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag Version
        id: pre_release
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tags
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/webchat-app:${{ steps.pre_release.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/webchat-app:latest

      - name: Build and push service tags
        run: |
          VERSION=${{ steps.pre_release.outputs.VERSION }}
          for SERVICE in auth chat gateway messages; do
            docker buildx build --platform linux/amd64 -f deploy/docker/Dockerfile \
              -t ghcr.io/${{ github.repository }}/${SERVICE}:${VERSION} \
              -t ghcr.io/${{ github.repository }}/${SERVICE}:latest --push .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pre_release.outputs.VERSION }}
          name: Release ${{ steps.pre_release.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
