services:
  # ── Databases ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webchat}
      POSTGRES_DB: ${POSTGRES_DB:-webchat}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webchat} -d ${POSTGRES_DB:-webchat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Message Queue — RabbitMQ ──────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-webchat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-webchat}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Elasticsearch + Kibana ────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 8

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles:
      - kibana

  # ── Application Services ──────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      - WEBCHAT_SERVICE=auth
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-webchat}:${POSTGRES_PASSWORD:-webchat}@postgres:5432/${POSTGRES_DB:-webchat}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES:-15m}
      - JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES:-7d}
      - PORT_AUTH=3001
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - app

  messages:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      - WEBCHAT_SERVICE=messages
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/webchat
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - AUTH_SERVICE_URL=http://auth:3001
      - PORT_MESSAGES=3003
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "3003:3003"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - app

  # ── Message Worker (RabbitMQ consumer) ───────────────────────────────────────
  message-worker:
    build:
      context: .
      dockerfile: services/message-worker/Dockerfile
    environment:
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-webchat}:${RABBITMQ_PASS:-webchat}@rabbitmq:5672
      - MONGO_URI=mongodb://mongo:27017/webchat
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ES_INDEX=webchat-messages
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles:
      - app

  # ── Uploads Service (AWS S3 presigning) ──────────────────────────────────────
  uploads:
    build:
      context: .
      dockerfile: services/uploads/Dockerfile
    environment:
      - NODE_ENV=production
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET:-webchat-uploads}
      - S3_PUBLIC_BUCKET=${S3_PUBLIC_BUCKET:-false}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - AUTH_SERVICE_URL=http://auth:3001
      - PORT_UPLOADS=3004
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "3004:3004"
    profiles:
      - app

  chat:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      - WEBCHAT_SERVICE=chat
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-webchat}:${RABBITMQ_PASS:-webchat}@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth:3001
      - MESSAGES_SERVICE_URL=http://messages:3003
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - PORT_CHAT=5000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles:
      - app

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      - WEBCHAT_SERVICE=gateway
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth:3001
      - MESSAGES_SERVICE_URL=http://messages:3003
      - CHAT_SERVICE_PUBLIC_URL=http://chat:5000
      - UPLOADS_SERVICE_URL=http://uploads:3004
      - PORT_GATEWAY=4000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "4000:4000"
    profiles:
      - app

  # ── Prometheus + Grafana ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=webchat
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafdata:/var/lib/grafana
      - ./deploy/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  pgdata:
  mongodata:
  esdata:
  promdata:
  grafdata:
  rabbitdata: