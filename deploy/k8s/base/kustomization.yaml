apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webchat

resources:
  - namespace.yaml
  - postgres.yaml
  - mongo.yaml
  - redis.yaml
  - rabbitmq.yaml
  - minio.yaml
  - elasticsearch.yaml
  - auth.yaml
  - messages.yaml
  - chat.yaml
  - gateway.yaml
  - workers.yaml
  - ingress.yaml
  - monitoring.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

secretGenerator:
  - name: webchat-db
    literals:
      - POSTGRES_USER=webchat
      - POSTGRES_PASSWORD=webchat
      - POSTGRES_DB=webchat
    options:
      disableNameSuffixHash: true
  - name: webchat-app
    literals:
      - JWT_SECRET=replace-me-use-openssl-rand-hex-32
      - DATABASE_URL=postgres://webchat:webchat@postgres:5432/webchat
    options:
      disableNameSuffixHash: true
  - name: webchat-rabbitmq
    literals:
      - RABBITMQ_USER=webchat
      - RABBITMQ_PASS=replace-me-rabbit-password
      - RABBITMQ_URL=amqp://webchat:replace-me-rabbit-password@rabbitmq:5672
    options:
      disableNameSuffixHash: true
  - name: webchat-minio
    literals:
      - MINIO_ACCESS_KEY=replace-me-minio-access-key
      - MINIO_SECRET_KEY=replace-me-minio-secret-key
    options:
      disableNameSuffixHash: true

configMapGenerator:
  - name: webchat-config
    literals:
      - AUTH_SERVICE_URL=http://auth:3001
      - MESSAGES_SERVICE_URL=http://messages:3003
      - UPLOADS_SERVICE_URL=http://uploads:3004
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/webchat
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://webchat.local
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ES_INDEX=webchat_messages
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_BUCKET=webchat-uploads
    options:
      disableNameSuffixHash: true

