apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: webchat
  labels:
    app: client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: nginx
          image: webchat-client:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "25m"
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: webchat
spec:
  selector:
    app: client
  ports:
    - port: 80
      targetPort: http
