apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: webchat
spec:
  template:
    spec:
      initContainers:
        - name: wait-uploads
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z uploads 3004; do echo waiting for uploads; sleep 2; done
      containers:
        - name: gateway
          envFrom:
            - configMapRef:
                name: webchat-config
            - secretRef:
                name: webchat-app
                optional: true
