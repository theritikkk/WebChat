global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["host.docker.internal:4000"]
    metrics_path: /metrics

  - job_name: "chat"
    static_configs:
      - targets: ["host.docker.internal:5000"]
    metrics_path: /metrics

  - job_name: "messages"
    static_configs:
      - targets: ["host.docker.internal:3003"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
